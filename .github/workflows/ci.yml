name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas do mesmo PR/branch quando chega um commit novo
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Valores fictícios: o build valida o formato das variáveis em src/lib/env.ts,
      # mas não se conecta a nenhum serviço. Os valores reais ficam só na Vercel.
      FIREBASE_API_KEY: ci-placeholder
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      GITHUB_API_URL: https://api.github.com
      GITHUB_USERNAME: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # mesma versão da Vercel (engines.node)
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
