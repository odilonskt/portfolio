name: Deploy

# Substitui a integração nativa da Vercel (GitHub App). Precisa dos secrets
# VERCEL_TOKEN (escopo do time dono do projeto) e VERCEL_ORG_ID/VERCEL_PROJECT_ID
# (Team ID e Project ID copiados do painel da Vercel — o .vercel/project.json local
# aponta para um projeto antigo).
#
# Merge na main deve ser feito por uma pessoa (botão "Merge" no PR), não por um
# workflow com GITHUB_TOKEN: eventos gerados pelo GITHUB_TOKEN não disparam outros
# workflows, então um merge automático feito assim nunca chegaria a este deploy.
#
# O build roda NA Vercel (vercel deploy sem --prebuilt), não aqui: as variáveis de
# ambiente marcadas como "Sensitive" na Vercel nunca são entregues ao CLI
# (vercel pull grava "[SENSITIVE]" no lugar), então um build no Actions geraria as
# páginas estáticas com valores falsos.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Deploy (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # só para comentar a URL do preview no PR
    # Escopo do job (não do workflow): só os passos deste job enxergam os IDs
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Vercel CLI
        run: npm install --global vercel@65.2.0

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --yes --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comentar a URL do preview no PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔗 Preview: ${process.env.PREVIEW_URL}`,
            })

  production:
    name: Deploy (produção)
    # workflow_dispatch: permite publicar de novo à mão (Actions → Deploy → Run workflow),
    # mas só a partir da main — o "Run workflow" deixa escolher qualquer branch
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Vercel CLI
        run: npm install --global vercel@65.2.0

      - name: Deploy
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
